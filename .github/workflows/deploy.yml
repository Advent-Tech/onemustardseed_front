name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Build & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

  deploy:
    name: Deploy Frontend to VPS
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Code & Rebuild Container via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/onemustardseed' }}
        run: |
          echo "=========================================="
          echo "🚀 Deploying One Mustard Seed Frontend"
          echo "=========================================="

          # Setup SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Ensure target directory exists on VPS
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "mkdir -p $DEPLOY_PATH/onemustardseed_front"

          # Sync repository files to VPS (excluding .env, node_modules, dist, .git)
          echo "📦 Syncing frontend files to VPS..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'dist' \
            --exclude '.tanstack' \
            ./ "$USER@$HOST:$DEPLOY_PATH/onemustardseed_front/"

          # Rebuild and restart frontend container
          echo "🐳 Rebuilding frontend container on VPS..."
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "
            cd $DEPLOY_PATH
            podman rm -f oms-frontend 2>/dev/null || true
            docker compose up -d --no-deps --build frontend
            podman image prune -a -f
            sleep 3
            podman ps --filter name=oms-frontend
          "

          echo "=========================================="
          echo "✅ Frontend deployment completed!"
          echo "=========================================="
